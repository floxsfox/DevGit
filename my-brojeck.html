<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>my brojeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f1eef8;--dim:#a29fb3;--panel:rgba(6,5,10,.86);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scrollbar-width:thin;scrollbar-color:#CC33FF #000}
body{background:#000;color:var(--ink);font:400 16px/1.55 "Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#000}::-webkit-scrollbar-thumb{background:#CC33FF}
@media(pointer:coarse){html{scrollbar-width:none}::-webkit-scrollbar{display:none}}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px max(56px,env(safe-area-inset-bottom));display:grid;gap:26px}
@media(min-width:860px){main{grid-template-columns:320px 1fr;gap:56px;padding-top:72px}.side{position:sticky;top:48px;align-self:start}}
h1{font-weight:700;font-size:clamp(46px,12vw,78px);line-height:1;letter-spacing:-.03em;margin-bottom:22px;text-shadow:0 2px 14px #000;overflow-wrap:anywhere}
#logo span{display:inline-block;animation:drop 1s both}
@keyframes drop{0%{transform:translateY(-110vh);opacity:0}1%{opacity:1}55%{transform:translateY(0);animation-timing-function:ease-out}70%{transform:translateY(-16%)}84%{transform:translateY(0)}92%{transform:translateY(-4%)}100%{transform:translateY(0)}}
.profile{background:var(--panel);padding:20px;display:grid;gap:12px}
.av{width:92px;height:92px;display:block;background:#15131c}
.profile h2{font-size:1.35rem;line-height:1.2}
.profile a{color:var(--ink);text-underline-offset:3px}
.muted{color:var(--dim)}
.st{display:flex;flex-wrap:wrap;gap:6px 18px}.st b{font-weight:700}
.info{display:grid;gap:2px;font-size:.92rem;color:var(--dim)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px;background:var(--panel);padding:12px 16px}
.bar h2{font-size:1.2rem;flex:1}
#q{font:inherit;color:var(--ink);background:#14121b;border:2px solid #2a2735;padding:9px 12px;min-width:0;width:100%;max-width:240px;border-radius:0}
#q:focus{outline:none;border-color:#00CCFF}
#list{display:grid;gap:8px;padding:0}
.row{list-style:none;background:var(--panel);border-left:6px solid var(--c);transition:border-left-width .25s}
.row.open{border-left-width:14px}
.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:32px 1fr;gap:3px 14px;width:100%;padding:14px 16px;cursor:pointer}
.head:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.mk{grid-row:span 3;width:32px;height:32px}
.nm{font-weight:600;font-size:1.12rem;overflow-wrap:anywhere}
.ds{color:var(--dim);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--dim);font-size:.85rem}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden;min-height:0}
.in{padding:2px 16px 18px 62px;display:grid;gap:12px;justify-items:start}
.links{display:flex;flex-wrap:wrap;gap:6px 18px}
.links a{color:var(--ink);text-underline-offset:3px}
.btn{display:inline-block;min-height:44px;padding:11px 18px;background:var(--c);color:#0a0a0f;font:600 .98rem "Familjen Grotesk",system-ui,sans-serif;border:0;border-radius:0;cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:active{transform:translate(2px,2px)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sk{height:76px;list-style:none;background:var(--panel);border-left:6px solid #2a2735;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.err{background:var(--panel);padding:20px;display:grid;gap:10px;justify-items:start;border-left:6px solid #FF3366}
dialog{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(560px,100%);max-height:82dvh;padding:0;border:0;border-top:5px solid var(--c);background:#0d0c14;color:var(--ink);overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){dialog{inset:0;margin:auto;height:fit-content;border:0;border-left:8px solid var(--c)}}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
dialog::backdrop{background:rgba(0,0,0,.65)}
.sh{padding:18px;display:grid;gap:14px}
.sht{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sht h3{font-size:1.25rem;overflow-wrap:anywhere}
.sht button{font:inherit;color:var(--ink);background:#1c1a26;border:0;padding:10px 14px;min-height:44px;cursor:pointer}
.ver{display:flex;align-items:center;gap:10px}
.ver select{flex:1;font:inherit;color:var(--ink);background:#14121b;border:2px solid #2a2735;padding:9px;min-width:0;border-radius:0}
#sbody{display:grid;gap:8px}
.file{display:grid;gap:2px;padding:12px 14px;background:#171520;border-left:5px solid var(--c);color:var(--ink);text-decoration:none;transition:background .15s}
.file:hover,.file:focus-visible{background:#22202e;outline:none}
.file b{font-weight:600;overflow-wrap:anywhere}.file span{color:var(--dim);font-size:.85rem}
#sgh{color:var(--dim);text-underline-offset:3px}
#sb{display:none;position:fixed;right:0;top:max(8px,env(safe-area-inset-top));bottom:max(8px,env(safe-area-inset-bottom));width:22px;z-index:5;touch-action:none;opacity:.3;transition:opacity .3s}
#sb.on{opacity:1}
#sb i{position:absolute;right:4px;width:6px;min-height:40px;transition:width .15s}
#sb.on i{width:9px}
@media(pointer:coarse){#sb{display:block}}
#sb[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){#logo span,dialog[open],.sk{animation:none}.body,.row{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="sb" hidden><i></i></div>

<main>
  <div class="side">
    <h1 id="logo" aria-label="my brojeck">my brojeck</h1>
    <section class="profile" id="who" aria-live="polite"><p class="muted">Memuat profil…</p></section>
  </div>
  <section>
    <div class="bar">
      <h2>Proyek</h2>
      <input id="q" type="search" placeholder="Cari proyek" aria-label="Cari proyek" autocomplete="off">
    </div>
    <ol id="list" style="list-style:none"><li class="sk"></li><li class="sk"></li><li class="sk"></li></ol>
  </section>
</main>

<dialog id="sheet" aria-labelledby="stitle">
  <div class="sh">
    <div class="sht"><h3 id="stitle"></h3><button id="sx" type="button">Tutup</button></div>
    <label class="ver" id="sver">Versi <select id="ssel"></select></label>
    <div id="sbody"></div>
    <a id="sgh" target="_blank" rel="noopener">Lihat rilis di GitHub</a>
  </div>
</dialog>

<script>
const USER='floxsfox',API='https://api.github.com';
const PAL=['#FF3366','#FF9900','#FFCC00','#33CC66','#00CCFF','#3366FF','#CC33FF','#FF33CC','#00FFCC','#FF5050'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const color=n=>PAL[hash(n)%PAL.length];
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const dt=d=>new Intl.DateTimeFormat('id-ID',{dateStyle:'medium'}).format(new Date(d));

/* ---------- Logo: huruf jatuh ---------- */
$('#logo').innerHTML=[...'my brojeck'].map((ch,i)=>`<span aria-hidden="true" style="animation-delay:${i*70}ms">${ch===' '?'&nbsp;':ch}</span>`).join('');

/* ---------- GitHub ---------- */
async function gh(path){
  const k='mb:'+path;
  try{const c=JSON.parse(sessionStorage.getItem(k)||'null');if(c&&Date.now()-c.t<6e5)return c.d}catch(e){}
  const res=await fetch(API+path,{headers:{Accept:'application/vnd.github+json'}});
  if(!res.ok){const e=new Error('http');e.status=res.status;throw e}
  const d=await res.json();
  try{sessionStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch(e){}
  return d;
}

function mark(n){
  let h=hash(n),r='';
  for(let y=0;y<4;y++)for(let x=0;x<2;x++){
    h=Math.imul(h^(h>>>13),1274126177)>>>0;
    if((h&1)||y===3)r+=`<rect x="${x*8}" y="${y*8}" width="7" height="7"/><rect x="${(3-x)*8}" y="${y*8}" width="7" height="7"/>`;
  }
  return `<svg class="mk" viewBox="0 0 31 31" fill="${color(n)}" aria-hidden="true">${r}</svg>`;
}

function renderWho(u){
  const info=[u.location,u.company,u.blog&&`<a href="${esc(/^https?:/.test(u.blog)?u.blog:'https://'+u.blog)}" target="_blank" rel="noopener">${esc(u.blog)}</a>`,u.created_at&&'Bergabung '+dt(u.created_at)].filter(Boolean);
  $('#who').innerHTML=`
    <img class="av" src="${esc(u.avatar_url)}&s=200" alt="Foto profil ${esc(u.login)}" width="92" height="92" onerror="this.style.visibility='hidden'">
    <div><h2>${esc(u.name||u.login)}</h2><a href="${esc(u.html_url)}" target="_blank" rel="noopener" class="muted">@${esc(u.login)}</a></div>
    ${u.bio?`<p>${esc(u.bio)}</p>`:''}
    <div class="st"><span><b>${u.public_repos}</b> proyek</span><span><b>${u.followers}</b> pengikut</span><span><b>${u.following}</b> mengikuti</span></div>
    ${info.length?`<div class="info">${info.map(i=>`<span>${i.startsWith('<a')?i:esc(i)}</span>`).join('')}</div>`:''}`;
}

const rels={};
function renderList(rs){
  if(!rs.length){$('#list').innerHTML='<li class="err" style="list-style:none"><p>Belum ada proyek publik di akun ini.</p></li>';return}
  $('#list').innerHTML=rs.map(r=>`
    <li class="row" style="--c:${color(r.name)}" data-n="${esc(r.name)}" data-s="${esc((r.name+' '+(r.description||'')+' '+(r.language||'')).toLowerCase())}">
      <button class="head" type="button" aria-expanded="false">
        ${mark(r.name)}
        <span class="nm">${esc(r.name)}</span>
        ${r.description?`<span class="ds">${esc(r.description)}</span>`:''}
        <span class="meta">${r.language?`<span>${esc(r.language)}</span>`:''}<span>${r.stargazers_count} bintang</span>${r.fork?'<span>fork</span>':''}<span>diperbarui ${dt(r.pushed_at||r.updated_at)}</span></span>
      </button>
      <div class="body"><div><div class="in">
        ${(r.topics&&r.topics.length)?`<span class="muted">${r.topics.map(esc).join(', ')}</span>`:''}
        <div class="links"><a href="${esc(r.html_url)}" target="_blank" rel="noopener">Buka di GitHub</a>${r.homepage?`<a href="${esc(/^https?:/.test(r.homepage)?r.homepage:'https://'+r.homepage)}" target="_blank" rel="noopener">Situs proyek</a>`:''}</div>
        <div class="rel muted">Memeriksa rilis…</div>
      </div></div></div>
    </li>`).join('');
  window._repos=Object.fromEntries(rs.map(r=>[r.name,r]));
}

async function loadRel(li){
  const n=li.dataset.n,box=li.querySelector('.rel');
  try{
    const all=await gh(`/repos/${USER}/${encodeURIComponent(n)}/releases?per_page=15`);
    const list=all.filter(r=>!r.draft);rels[n]=list;
    if(!list.length){box.textContent='Belum ada rilis untuk proyek ini.';return}
    const a=list[0],cnt=(a.assets||[]).length;
    box.className='rel';
    box.innerHTML=`<p class="muted" style="margin-bottom:10px">Rilis terbaru: ${esc(a.name||a.tag_name)}, ${dt(a.published_at||a.created_at)}</p><button class="btn pick" type="button">${cnt?`Pilih file unduhan (${cnt})`:'Lihat rilis'}</button>`;
  }catch(e){
    box.innerHTML=`Rilis belum bisa dimuat. <a href="https://github.com/${USER}/${esc(n)}/releases" target="_blank" rel="noopener" style="color:inherit">Buka halaman rilis</a>`;
  }
}

/* ---------- Sheet pilih file ---------- */
const sheet=$('#sheet');
function openSheet(n){
  const list=rels[n],repo=window._repos[n];
  sheet.style.setProperty('--c',color(n));
  $('#stitle').textContent=n;
  $('#sgh').href=repo.html_url+'/releases';
  const sel=$('#ssel');
  sel.innerHTML=list.map((r,k)=>`<option value="${k}">${esc(r.name||r.tag_name)}${r.prerelease?' (pra-rilis)':''}</option>`).join('');
  $('#sver').style.display=list.length>1?'flex':'none';
  const draw=()=>{
    const r=list[sel.value],as=r.assets||[];
    $('#sbody').innerHTML=as.length?as.map(a=>`<a class="file" href="${esc(a.browser_download_url)}"><b>${esc(a.name)}</b><span>${fmt(a.size)}, ${a.download_count} unduhan</span></a>`).join(''):'<p class="muted">Rilis ini tidak punya file terlampir. Buka di GitHub untuk melihat kode sumbernya.</p>';
  };
  sel.onchange=draw;draw();
  sheet.showModal();
}
$('#sx').onclick=()=>sheet.close();
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.close()});

/* ---------- Interaksi daftar ---------- */
$('#list').addEventListener('click',e=>{
  const pick=e.target.closest('.pick');
  if(pick){openSheet(pick.closest('.row').dataset.n);return}
  const head=e.target.closest('.head');
  if(!head)return;
  const li=head.parentElement,open=li.classList.toggle('open');
  head.setAttribute('aria-expanded',open);
  if(open&&!li.dataset.loaded){li.dataset.loaded=1;loadRel(li)}
});
$('#q').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.row').forEach(li=>li.hidden=!!v&&!li.dataset.s.includes(v));
});

async function load(){
  $('#who').innerHTML='<p class="muted">Memuat profil…</p>';
  $('#list').innerHTML='<li class="sk"></li><li class="sk"></li><li class="sk"></li>';
  try{
    const [u,rs]=await Promise.all([gh(`/users/${USER}`),gh(`/users/${USER}/repos?per_page=100&sort=pushed`)]);
    renderWho(u);renderList(rs);
  }catch(e){
    const why=(e.status===403||e.status===429)?'Batas permintaan GitHub sedang tercapai. Tunggu beberapa menit lalu coba lagi.':e.status===404?'Akun GitHub '+USER+' tidak ditemukan.':'Tidak bisa terhubung ke GitHub. Periksa internet, lalu coba lagi.';
    const html=`<p><b>Data GitHub belum bisa dimuat.</b></p><p class="muted">${why}</p><button class="btn" style="--c:#00CCFF" type="button" id="retry">Coba lagi</button><a href="https://github.com/${USER}" target="_blank" rel="noopener" style="color:inherit">Buka github.com/${USER}</a>`;
    $('#who').innerHTML='<p class="muted">Profil belum termuat.</p>';
    $('#list').innerHTML=`<li class="err" style="list-style:none">${html}</li>`;
    $('#retry').onclick=load;
  }
}
load();

/* ---------- Scrollbar untuk ponsel ---------- */
(()=>{
  const sb=$('#sb'),th=sb.firstElementChild;let t,drag=false;
  const de=document.documentElement;
  function upd(){
    const max=de.scrollHeight-innerHeight;
    if(max<=8){sb.hidden=true;return}
    sb.hidden=false;
    const h=sb.clientHeight,l=Math.max(40,h*innerHeight/de.scrollHeight),p=Math.min(1,scrollY/max);
    th.style.height=l+'px';th.style.transform=`translateY(${p*(h-l)}px)`;th.style.background=`hsl(${Math.round(p*300)} 90% 60%)`;
    sb.classList.add('on');clearTimeout(t);
    if(!drag)t=setTimeout(()=>sb.classList.remove('on'),1200);
  }
  function mv(e){
    const r=sb.getBoundingClientRect(),l=th.offsetHeight,p=(e.clientY-r.top-l/2)/(r.height-l);
    scrollTo(0,Math.min(1,Math.max(0,p))*(de.scrollHeight-innerHeight));
  }
  addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);
  new ResizeObserver(upd).observe(document.body);
  sb.addEventListener('pointerdown',e=>{drag=true;sb.setPointerCapture(e.pointerId);mv(e)});
  sb.addEventListener('pointermove',e=>{if(drag)mv(e)});
  const end=()=>{drag=false;upd()};
  sb.addEventListener('pointerup',end);sb.addEventListener('pointercancel',end);
  upd();
})();

/* ---------- Background: hujan kotak pelangi + fisika ---------- */
(()=>{
  const cv=$('#bg'),ctx=cv.getContext('2d',{alpha:false});
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const G=.7,BOUNCE=.3;
  let S,W,H,cols,maxRows,stack=[],boxes=[],lim;

  function size(){
    const dpr=Math.min(devicePixelRatio||1,2),oldCols=cols;
    W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    S=W<600?14:W>1400?16:12;
    cols=Math.ceil(W/S);
    maxRows=Math.max(6,Math.floor(H/S*.32));
    lim=W<600?30:45;
    if(cols!==oldCols){stack=Array.from({length:cols},()=>[]);boxes=[]}
    if(reduce){seed();draw()}
  }
  function seed(){
    stack=Array.from({length:cols},()=>Array.from({length:Math.floor(Math.random()*maxRows*.7)},()=>PAL[Math.random()*PAL.length|0]));
  }
  function spawn(){
    boxes.push({x:(Math.random()*cols|0)*S,y:-S,vx:(Math.random()-.5)*.6,vy:2+Math.random()*3,c:PAL[Math.random()*PAL.length|0],n:0});
  }
  function pop(c,vx,vy){
    const a=stack[c];if(!a||!a.length)return;
    boxes.push({x:c*S,y:H-a.length*S,vx,vy,c:a.pop(),n:0});
  }
  function collapse(){
    for(let c=0;c<cols;c++){
      const a=stack[c];
      for(let r=0;r<a.length;r++)boxes.push({x:c*S,y:H-(r+1)*S,vx:(Math.random()-.5)*5,vy:-Math.random()*7,c:a[r],n:0,thru:1});
      a.length=0;
    }
  }
  function blast(px,py,R,power){
    for(let c=Math.max(0,Math.floor((px-R)/S));c<=Math.min(cols-1,Math.ceil((px+R)/S));c++){
      const a=stack[c];
      while(a.length){
        const dx=c*S+S/2-px,dy=H-(a.length-.5)*S-py,d=Math.hypot(dx,dy)||1;
        if(d>R)break;
        const k=power*(1-d/R)+1;
        pop(c,dx/d*k*.6+(Math.random()-.5),dy/d*k-3);
      }
    }
    for(const b of boxes){
      const dx=b.x+S/2-px,dy=b.y+S/2-py,d=Math.hypot(dx,dy);
      if(d<R&&d>0){const k=power*(1-d/R);b.vx+=dx/d*k;b.vy+=dy/d*k*.5}
    }
  }
  function step(){
    if(boxes.length<lim&&Math.random()<.55)spawn();
    for(let i=boxes.length-1;i>=0;i--){
      const b=boxes[i];
      b.vy+=G;b.y+=b.vy;b.x+=b.vx;b.vx*=.985;
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}
      if(b.x>W-S){b.x=W-S;b.vx=-Math.abs(b.vx)}
      if(b.thru){if(b.y>H+S)boxes.splice(i,1);continue}
      const c=Math.min(cols-1,Math.max(0,Math.round(b.x/S)));
      const top=H-(stack[c].length+1)*S;
      if(b.y>top-S*3)b.x+=(c*S-b.x)*.25;
      if(b.y>=top){
        if(b.vy>4&&b.n<2){b.y=top;b.vy*=-BOUNCE;b.n++;b.vx+=(Math.random()-.5)*2}
        else{stack[c].push(b.c);boxes.splice(i,1);if(stack[c].length>=maxRows)collapse()}
      }
    }
  }
  function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    for(let c=0;c<cols;c++){
      const a=stack[c];
      for(let r=0;r<a.length;r++){ctx.fillStyle=a[r];ctx.fillRect(c*S+1,H-(r+1)*S+1,S-1,S-1)}
    }
    for(const b of boxes){ctx.fillStyle=b.c;ctx.fillRect(b.x+1,b.y+1,S-1,S-1)}
  }

  addEventListener('resize',size);
  size();
  if(reduce)return;

  /* interaksi: kursor, sentuhan, dan scroll mengguncang tumpukan */
  addEventListener('pointermove',e=>{if(e.pointerType==='mouse')blast(e.clientX,e.clientY,48,2.2)},{passive:true});
  addEventListener('pointerdown',e=>blast(e.clientX,e.clientY,86,5),{passive:true});
  let lastY=scrollY;
  addEventListener('scroll',()=>{
    const d=Math.abs(scrollY-lastY);lastY=scrollY;
    if(d<4)return;
    for(let k=0;k<Math.min(4,1+(d/14|0));k++)pop(Math.random()*cols|0,(Math.random()-.5)*3,-(2+d*.08));
  },{passive:true});

  let last=0,active=true;
  const gap=1000/45;
  function loop(t){
    if(!active)return;
    requestAnimationFrame(loop);
    const el=t-last;if(el<gap)return;
    last=t-(el%gap);
    step();draw();
  }
  document.addEventListener('visibilitychange',()=>{
    active=!document.hidden;
    if(active){last=performance.now();requestAnimationFrame(loop)}
  });
  requestAnimationFrame(loop);
})();
</script>
