<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>DevGit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f1eef8;--dim:#a29fb3;--panel:rgba(6,5,10,.86);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scrollbar-width:thin;scrollbar-color:#CC33FF #000}
body{background:#000;color:var(--ink);font:400 16px/1.55 "Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#000}::-webkit-scrollbar-thumb{background:#CC33FF}
@media(pointer:coarse){html{scrollbar-width:none}::-webkit-scrollbar{display:none}}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px max(56px,env(safe-area-inset-bottom));display:grid;gap:26px}
@media(min-width:860px){main{grid-template-columns:320px 1fr;gap:56px;padding-top:72px}.side{position:sticky;top:48px;align-self:start}}
h1{margin-bottom:22px;line-height:0}
#logo canvas{display:block;max-width:100%}
.profile{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:20px;display:grid;gap:12px}
.ava{position:relative;width:108px;height:108px;padding:3px;border-radius:50%;background:conic-gradient(#FF3366,#FF9900,#FFCC00,#33CC66,#00CCFF,#3366FF,#CC33FF,#FF3366)}
.av{width:100%;height:100%;display:block;border-radius:50%;border:4px solid #0d1117;background:#15131c;object-fit:cover}
.gh{position:absolute;right:-4px;bottom:-2px;width:36px;height:36px;border-radius:50%;background:#0d1117;border:2px solid #30363d;display:grid;place-items:center;transition:transform .15s}
.gh:hover,.gh:focus-visible{transform:scale(1.12);outline:none}
.gh svg{width:20px;height:20px;fill:#f0f6fc}
.profile h2{font-size:1.35rem;line-height:1.2}
.profile a{color:var(--ink);text-underline-offset:3px}
.muted{color:var(--dim)}
.st{display:flex;flex-wrap:wrap;gap:6px 18px}.st b{font-weight:700}
.info{display:grid;gap:2px;font-size:.92rem;color:var(--dim)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px 16px}
.bar h2{font-size:1.2rem;flex:1}
#q{font:inherit;color:var(--ink);background:#14121b;border:2px solid #2a2735;padding:9px 12px;min-width:0;width:100%;max-width:240px;border-radius:6px}
#q:focus{outline:none;border-color:#00CCFF}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;padding:0}
.card{list-style:none;display:flex;flex-direction:column;gap:10px;padding:16px;background:#0d1117;border:1px solid #30363d;border-radius:8px;transition:border-color .2s;min-width:0}
.card:hover{border-color:var(--c)}
.ct{display:flex;align-items:center;gap:10px;min-width:0}
.ct .mk{width:28px;height:28px;flex:none}
.ct a{color:#58a6ff;font-weight:600;font-size:1.05rem;text-decoration:none;overflow-wrap:anywhere;min-width:0}
.ct a:hover,.ct a:focus-visible{text-decoration:underline}
.tag{margin-left:auto;font-size:.75rem;color:var(--dim);border:1px solid #30363d;border-radius:99px;padding:0 8px;flex:none}
.cd{color:var(--dim);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1;min-height:1.5em}
.cm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--dim);align-items:center}
.cm i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--lc)}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;align-items:center}
.card .btn{min-height:40px;padding:7px 14px;font-size:.88rem}
.btn.alt{background:#21262d;color:var(--ink);border:1px solid #30363d;display:inline-flex;align-items:center;gap:6px}
.btn.alt:hover{background:#30363d}
.btn.follow{background:#238636;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.follow:hover{background:#2ea043}
.btn svg{width:14px;height:14px;fill:currentColor}
.chk{color:var(--dim);font-size:.84rem}
.btn{display:inline-block;min-height:44px;padding:11px 18px;background:var(--c);color:#0a0a0f;font:600 .98rem "Familjen Grotesk",system-ui,sans-serif;border:0;border-radius:6px;cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:active{transform:translate(2px,2px)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sk{height:150px;list-style:none;background:#0d1117;border:1px solid #30363d;border-radius:8px;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.err{grid-column:1/-1;background:#0d1117;border:1px solid #30363d;border-left:5px solid #FF3366;border-radius:8px;padding:20px;display:grid;gap:10px;justify-items:start}
dialog{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(560px,100%);max-height:82dvh;padding:0;border:0;border-top:5px solid var(--c);background:#0d0c14;color:var(--ink);overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){dialog{inset:0;margin:auto;height:fit-content;border:0;border-left:8px solid var(--c)}}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
dialog::backdrop{background:rgba(0,0,0,.65)}
.sh{padding:18px;display:grid;gap:14px}
.sht{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sht h3{font-size:1.25rem;overflow-wrap:anywhere}
.sht button{font:inherit;color:var(--ink);background:#1c1a26;border:0;padding:10px 14px;min-height:44px;cursor:pointer}
.ver{display:flex;align-items:center;gap:10px}
.ver select{flex:1;font:inherit;color:var(--ink);background:#14121b;border:2px solid #2a2735;padding:9px;min-width:0;border-radius:0}
#sbody{display:grid;gap:8px}
.file{display:grid;gap:2px;padding:12px 14px;background:#171520;border-left:5px solid var(--c);color:var(--ink);text-decoration:none;transition:background .15s}
.file:hover,.file:focus-visible{background:#22202e;outline:none}
.file b{font-weight:600;overflow-wrap:anywhere}.file span{color:var(--dim);font-size:.85rem}
#sgh{color:var(--dim);text-underline-offset:3px}
#sb{display:none;position:fixed;right:0;top:max(8px,env(safe-area-inset-top));bottom:max(8px,env(safe-area-inset-bottom));width:22px;z-index:5;touch-action:none;opacity:.3;transition:opacity .3s}
#sb.on{opacity:1}
#sb i{position:absolute;right:4px;width:6px;min-height:40px;transition:width .15s}
#sb.on i{width:9px}
@media(pointer:coarse){#sb{display:block}}
#sb[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){#logo span,dialog[open],.sk{animation:none}.body,.row{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="sb" hidden><i></i></div>

<main>
  <div class="side">
    <h1 id="logo"><canvas role="img" aria-label="DevGit"></canvas></h1>
    <section class="profile" id="who" aria-live="polite"><p class="muted">Loading profile…</p></section>
  </div>
  <section>
    <div class="bar">
      <h2>Repositories <span id="cnt" class="muted"></span></h2>
      <input id="q" type="search" placeholder="Find a repository" aria-label="Find a repository" autocomplete="off">
    </div>
    <ol id="list" style="list-style:none"><li class="sk"></li><li class="sk"></li><li class="sk"></li></ol>
  </section>
</main>

<dialog id="sheet" aria-labelledby="stitle">
  <div class="sh">
    <div class="sht"><h3 id="stitle"></h3><button id="sx" type="button">Close</button></div>
    <label class="ver" id="sver">Version <select id="ssel"></select></label>
    <div id="sbody"></div>
    <a id="sgh" target="_blank" rel="noopener">View releases on GitHub</a>
  </div>
</dialog>

<script>
const USER='floxsfox',API='https://api.github.com';
const PAL=['#FF3366','#FF9900','#FFCC00','#33CC66','#00CCFF','#3366FF','#CC33FF','#FF33CC','#00FFCC','#FF5050'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const color=n=>PAL[hash(n)%PAL.length];
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const dt=d=>new Intl.DateTimeFormat('en-US',{dateStyle:'medium'}).format(new Date(d));

/* ---------- Logo: colored boxes merge, turn white, spell DevGit ---------- */
(()=>{
  const cv=$('#logo canvas'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const rgb=PAL.map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
  let boxes=[],W=0,H=0,B=6,t0=0,raf=0;
  const ease=p=>1-Math.pow(1-p,3);
  const F=s=>`700 ${s}px "Familjen Grotesk",system-ui,sans-serif`;
  function init(){
    const dpr=Math.min(devicePixelRatio||1,2);
    W=Math.min(cv.parentElement.clientWidth||320,420);
    const tmp=document.createElement('canvas'),tc=tmp.getContext('2d');
    let fs=120;tc.font=F(fs);
    while(tc.measureText('DevGit').width>W-4&&fs>30){fs-=2;tc.font=F(fs)}
    H=Math.ceil(fs*1.1);B=fs>=80?6:5;
    tmp.width=W;tmp.height=H;tc.font=F(fs);tc.fillStyle='#000';tc.fillText('DevGit',0,fs*.9);
    const d=tc.getImageData(0,0,W,H).data;
    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
    boxes=[];
    for(let y=0;y<H;y+=B)for(let x=0;x<W;x+=B){
      const cx=Math.min(W-1,x+(B>>1)),cy=Math.min(H-1,y+(B>>1));
      if(d[(cy*W+cx)*4+3]>110)boxes.push({tx:x,ty:y,sx:x+(Math.random()-.5)*160,sy:-20-Math.random()*H*1.6,ci:Math.random()*PAL.length|0,d:x/W*700+Math.random()*600,dur:800+Math.random()*500});
    }
  }
  function frame(now){
    const e=now-t0,sx=e/1000-2.8,ph=sx<0?-1:sx%7,wave=ph>=0&&ph<1.6?-50+ph/1.6*(W+100):-999;
    ctx.clearRect(0,0,W,H);
    for(const b of boxes){
      const p=Math.min(1,(e-b.d)/b.dur);
      if(p<=0)continue;
      const x=b.sx+(b.tx-b.sx)*ease(p),y=b.sy+(b.ty-b.sy)*p*p;
      let k=p<.75?0:(p-.75)/.25;
      const dist=Math.abs(b.tx-wave);
      if(p>=1&&dist<46)k=dist/46;
      if(k>=1)ctx.fillStyle='#fff';
      else{const c=rgb[b.ci];ctx.fillStyle=`rgb(${c[0]+(255-c[0])*k|0},${c[1]+(255-c[1])*k|0},${c[2]+(255-c[2])*k|0})`}
      ctx.fillRect(x+1,y+1,B-1,B-1);
    }
  }
  function loop(now){frame(now);raf=requestAnimationFrame(loop)}
  function start(skip){
    cancelAnimationFrame(raf);init();
    t0=performance.now()-(skip||reduce?4000:0);
    if(reduce){frame(t0+4000);return}
    raf=requestAnimationFrame(loop);
  }
  let lastW=0;
  const go=skip=>{lastW=Math.min(cv.parentElement.clientWidth||320,420);start(skip)};
  Promise.race([document.fonts?document.fonts.load('700 100px "Familjen Grotesk"'):0,new Promise(r=>setTimeout(r,900))]).then(()=>go(false));
  addEventListener('resize',()=>{if(Math.abs(Math.min(cv.parentElement.clientWidth||320,420)-lastW)>20)go(true)});
})();

/* ---------- GitHub ---------- */
async function gh(path){
  const k='mb:'+path;
  try{const c=JSON.parse(sessionStorage.getItem(k)||'null');if(c&&Date.now()-c.t<6e5)return c.d}catch(e){}
  const res=await fetch(API+path,{headers:{Accept:'application/vnd.github+json'}});
  if(!res.ok){const e=new Error('http');e.status=res.status;throw e}
  const d=await res.json();
  try{sessionStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch(e){}
  return d;
}

function mark(n){
  let h=hash(n),r='';
  for(let y=0;y<4;y++)for(let x=0;x<2;x++){
    h=Math.imul(h^(h>>>13),1274126177)>>>0;
    if((h&1)||y===3)r+=`<rect x="${x*8}" y="${y*8}" width="7" height="7"/><rect x="${(3-x)*8}" y="${y*8}" width="7" height="7"/>`;
  }
  return `<svg class="mk" viewBox="0 0 31 31" fill="${color(n)}" aria-hidden="true">${r}</svg>`;
}

const STAR='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>';
const PLUS='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>';
const LC={JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',HTML:'#e34c26',CSS:'#563d7c',Java:'#b07219',Kotlin:'#A97BFF','C':'#888888','C++':'#f34b7d','C#':'#178600',Go:'#00ADD8',Rust:'#dea584',Shell:'#89e051',Dart:'#00B4AB',GDScript:'#4f8fbf',Lua:'#4c4cff',PHP:'#4F5D95',Swift:'#F05138'};
const ext=u=>/^https?:/.test(u)?u:'https://'+u;

function renderWho(u){
  const info=[u.location&&esc(u.location),u.company&&esc(u.company),u.blog&&`<a href="${esc(ext(u.blog))}" target="_blank" rel="noopener">${esc(u.blog)}</a>`,u.created_at&&'Joined '+dt(u.created_at)].filter(Boolean);
  $('#who').innerHTML=`
    <div class="ava">
      <img class="av" src="${esc(u.avatar_url)}&s=240" alt="Profile photo of ${esc(u.login)}" width="108" height="108" onerror="this.style.visibility='hidden'">
      <a class="gh" href="${esc(u.html_url)}" target="_blank" rel="noopener" aria-label="Open ${esc(u.login)} on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    </div>
    <div><h2>${esc(u.name||u.login)}</h2><a href="${esc(u.html_url)}" target="_blank" rel="noopener" class="muted">@${esc(u.login)}</a></div>
    ${u.bio?`<p>${esc(u.bio)}</p>`:''}
    <div class="st"><span><b>${u.public_repos}</b> repositories</span><span><b>${u.followers}</b> followers</span><span><b>${u.following}</b> following</span></div>
    ${info.length?`<div class="info">${info.map(i=>`<span>${i}</span>`).join('')}</div>`:''}
    <a class="btn follow" href="${esc(u.html_url)}" target="_blank" rel="noopener">${PLUS} Follow @${esc(u.login)}</a>`;
}

const rels={};
const queue=[];let running=0;
function pump(){
  while(running<3&&queue.length){running++;loadRel(queue.shift()).finally(()=>{running--;pump()})}
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){io.unobserve(e.target);queue.push(e.target);pump()}
}),{rootMargin:'200px'});

function card(r){
  const c=color(r.name),lc=LC[r.language]||c;
  return `<li class="card" style="--c:${c};--lc:${lc}" data-n="${esc(r.name)}" data-s="${esc((r.name+' '+(r.description||'')+' '+(r.language||'')).toLowerCase())}">
    <div class="ct">${mark(r.name)}<a href="${esc(r.html_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>${r.fork?'<span class="tag">Fork</span>':r.archived?'<span class="tag">Archived</span>':''}</div>
    <p class="cd">${esc(r.description||'No description provided.')}</p>
    <div class="cm">${r.language?`<span><i></i>${esc(r.language)}</span>`:''}<span>${r.stargazers_count} stars</span><span>${r.forks_count} forks</span><span>Updated ${dt(r.pushed_at||r.updated_at)}</span></div>
    <div class="act"><a class="btn alt" href="${esc(r.html_url)}" target="_blank" rel="noopener" aria-label="Star ${esc(r.name)} on GitHub">${STAR} Star</a><span class="rel chk">Checking releases…</span></div>
  </li>`;
}

function renderList(rs){
  $('#cnt').textContent=rs.length?'('+rs.length+')':'';
  if(!rs.length){$('#list').innerHTML='<li class="err"><p>No public repositories yet.</p></li>';return}
  window._repos=Object.fromEntries(rs.map(r=>[r.name,r]));
  $('#list').innerHTML=rs.map(card).join('');
  document.querySelectorAll('.card').forEach(li=>io.observe(li));
}

async function loadRel(li){
  const n=li.dataset.n,box=li.querySelector('.rel');
  try{
    const list=(await gh(`/repos/${USER}/${encodeURIComponent(n)}/releases?per_page=15`)).filter(r=>!r.draft);
    rels[n]=list;
    if(!list.length){box.remove();return}
    const cnt=(list[0].assets||[]).length;
    box.outerHTML=`<button class="btn pick" type="button">Download${cnt?' ('+cnt+')':''}</button>`;
  }catch(e){
    box.outerHTML=`<a class="btn alt" href="${esc(window._repos[n].html_url)}/releases" target="_blank" rel="noopener">Releases</a>`;
  }
}

/* ---------- File picker sheet ---------- */
const sheet=$('#sheet');
function openSheet(n){
  const list=rels[n],repo=window._repos[n];
  sheet.style.setProperty('--c',color(n));
  $('#stitle').textContent=n;
  $('#sgh').href=repo.html_url+'/releases';
  const sel=$('#ssel');
  sel.innerHTML=list.map((r,k)=>`<option value="${k}">${esc(r.name||r.tag_name)}${r.prerelease?' (pre-release)':''}</option>`).join('');
  $('#sver').style.display=list.length>1?'flex':'none';
  const draw=()=>{
    const r=list[sel.value],as=r.assets||[];
    $('#sbody').innerHTML=as.length?as.map(a=>`<a class="file" href="${esc(a.browser_download_url)}"><b>${esc(a.name)}</b><span>${fmt(a.size)}, ${a.download_count} downloads</span></a>`).join(''):'<p class="muted">This release has no attached files. Open it on GitHub to get the source code.</p>';
  };
  sel.onchange=draw;draw();
  sheet.showModal();
}
$('#sx').onclick=()=>sheet.close();
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.close()});

$('#list').addEventListener('click',e=>{
  const pick=e.target.closest('.pick');
  if(pick)openSheet(pick.closest('.card').dataset.n);
});
$('#q').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(li=>li.hidden=!!v&&!li.dataset.s.includes(v));
});

async function load(){
  $('#who').innerHTML='<p class="muted">Loading profile…</p>';
  $('#list').innerHTML='<li class="sk"></li><li class="sk"></li><li class="sk"></li><li class="sk"></li>';
  try{
    const [u,rs]=await Promise.all([gh(`/users/${USER}`),gh(`/users/${USER}/repos?per_page=100&sort=pushed`)]);
    renderWho(u);renderList(rs);
  }catch(e){
    const why=(e.status===403||e.status===429)?'GitHub’s request limit was reached. Wait a few minutes and try again.':e.status===404?'The GitHub account '+USER+' wasn’t found.':'Couldn’t reach GitHub. Check your connection and try again.';
    $('#who').innerHTML='<p class="muted">Profile not loaded.</p>';
    $('#list').innerHTML=`<li class="err"><p><b>GitHub data couldn’t be loaded.</b></p><p class="muted">${why}</p><button class="btn" style="--c:#00CCFF" type="button" id="retry">Try again</button><a href="https://github.com/${USER}" target="_blank" rel="noopener" style="color:inherit">Open github.com/${USER}</a></li>`;
    $('#retry').onclick=load;
  }
}
load();

/* ---------- Scrollbar untuk ponsel ---------- */
(()=>{
  const sb=$('#sb'),th=sb.firstElementChild;let t,drag=false;
  const de=document.documentElement;
  function upd(){
    const max=de.scrollHeight-innerHeight;
    if(max<=8){sb.hidden=true;return}
    sb.hidden=false;
    const h=sb.clientHeight,l=Math.max(40,h*innerHeight/de.scrollHeight),p=Math.min(1,scrollY/max);
    th.style.height=l+'px';th.style.transform=`translateY(${p*(h-l)}px)`;th.style.background=`hsl(${Math.round(p*300)} 90% 60%)`;
    sb.classList.add('on');clearTimeout(t);
    if(!drag)t=setTimeout(()=>sb.classList.remove('on'),1200);
  }
  function mv(e){
    const r=sb.getBoundingClientRect(),l=th.offsetHeight,p=(e.clientY-r.top-l/2)/(r.height-l);
    scrollTo(0,Math.min(1,Math.max(0,p))*(de.scrollHeight-innerHeight));
  }
  addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);
  new ResizeObserver(upd).observe(document.body);
  sb.addEventListener('pointerdown',e=>{drag=true;sb.setPointerCapture(e.pointerId);mv(e)});
  sb.addEventListener('pointermove',e=>{if(drag)mv(e)});
  const end=()=>{drag=false;upd()};
  sb.addEventListener('pointerup',end);sb.addEventListener('pointercancel',end);
  upd();
})();

/* ---------- Background: hujan kotak pelangi + fisika ---------- */
(()=>{
  const cv=$('#bg'),ctx=cv.getContext('2d',{alpha:false});
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const G=.7,BOUNCE=.3;
  let S,W,H,cols,maxRows,stack=[],boxes=[],lim;

  function size(){
    const dpr=Math.min(devicePixelRatio||1,2),oldCols=cols;
    W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    S=W<600?14:W>1400?16:12;
    cols=Math.ceil(W/S);
    maxRows=Math.max(6,Math.floor(H/S*.32));
    lim=W<600?30:45;
    if(cols!==oldCols){stack=Array.from({length:cols},()=>[]);boxes=[]}
    if(reduce){seed();draw()}
  }
  function seed(){
    stack=Array.from({length:cols},()=>Array.from({length:Math.floor(Math.random()*maxRows*.7)},()=>PAL[Math.random()*PAL.length|0]));
  }
  function spawn(){
    boxes.push({x:(Math.random()*cols|0)*S,y:-S,vx:(Math.random()-.5)*.6,vy:2+Math.random()*3,c:PAL[Math.random()*PAL.length|0],n:0});
  }
  function pop(c,vx,vy){
    const a=stack[c];if(!a||!a.length)return;
    boxes.push({x:c*S,y:H-a.length*S,vx,vy,c:a.pop(),n:0});
  }
  function collapse(){
    for(let c=0;c<cols;c++){
      const a=stack[c];
      for(let r=0;r<a.length;r++)boxes.push({x:c*S,y:H-(r+1)*S,vx:(Math.random()-.5)*5,vy:-Math.random()*7,c:a[r],n:0,thru:1});
      a.length=0;
    }
  }
  function blast(px,py,R,power){
    for(let c=Math.max(0,Math.floor((px-R)/S));c<=Math.min(cols-1,Math.ceil((px+R)/S));c++){
      const a=stack[c];
      while(a.length){
        const dx=c*S+S/2-px,dy=H-(a.length-.5)*S-py,d=Math.hypot(dx,dy)||1;
        if(d>R)break;
        const k=power*(1-d/R)+1;
        pop(c,dx/d*k*.6+(Math.random()-.5),dy/d*k-3);
      }
    }
    for(const b of boxes){
      const dx=b.x+S/2-px,dy=b.y+S/2-py,d=Math.hypot(dx,dy);
      if(d<R&&d>0){const k=power*(1-d/R);b.vx+=dx/d*k;b.vy+=dy/d*k*.5}
    }
  }
  function step(){
    if(boxes.length<lim&&Math.random()<.55)spawn();
    for(let i=boxes.length-1;i>=0;i--){
      const b=boxes[i];
      b.vy+=G;b.y+=b.vy;b.x+=b.vx;b.vx*=.985;
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}
      if(b.x>W-S){b.x=W-S;b.vx=-Math.abs(b.vx)}
      if(b.thru){if(b.y>H+S)boxes.splice(i,1);continue}
      const c=Math.min(cols-1,Math.max(0,Math.round(b.x/S)));
      const top=H-(stack[c].length+1)*S;
      if(b.y>top-S*3)b.x+=(c*S-b.x)*.25;
      if(b.y>=top){
        if(b.vy>4&&b.n<2){b.y=top;b.vy*=-BOUNCE;b.n++;b.vx+=(Math.random()-.5)*2}
        else{stack[c].push(b.c);boxes.splice(i,1);if(stack[c].length>=maxRows)collapse()}
      }
    }
  }
  function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    for(let c=0;c<cols;c++){
      const a=stack[c];
      for(let r=0;r<a.length;r++){ctx.fillStyle=a[r];ctx.fillRect(c*S+1,H-(r+1)*S+1,S-1,S-1)}
    }
    for(const b of boxes){ctx.fillStyle=b.c;ctx.fillRect(b.x+1,b.y+1,S-1,S-1)}
  }

  addEventListener('resize',size);
  size();
  if(reduce)return;

  /* interaksi: kursor, sentuhan, dan scroll mengguncang tumpukan */
  addEventListener('pointermove',e=>{if(e.pointerType==='mouse')blast(e.clientX,e.clientY,48,2.2)},{passive:true});
  addEventListener('pointerdown',e=>blast(e.clientX,e.clientY,86,5),{passive:true});
  let lastY=scrollY;
  addEventListener('scroll',()=>{
    const d=Math.abs(scrollY-lastY);lastY=scrollY;
    if(d<4)return;
    for(let k=0;k<Math.min(4,1+(d/14|0));k++)pop(Math.random()*cols|0,(Math.random()-.5)*3,-(2+d*.08));
  },{passive:true});

  let last=0,active=true;
  const gap=1000/45;
  function loop(t){
    if(!active)return;
    requestAnimationFrame(loop);
    const el=t-last;if(el<gap)return;
    last=t-(el%gap);
    step();draw();
  }
  document.addEventListener('visibilitychange',()=>{
    active=!document.hidden;
    if(active){last=performance.now();requestAnimationFrame(loop)}
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
